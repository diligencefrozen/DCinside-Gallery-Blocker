<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc">
<title id="title">디시갤 차단기 기능 소개</title>
<desc id="desc">사용자 차단, 콘텐츠 차단, 갤러리별 설정, 읽은 글 표시하기, 게시글 미리보기, 편리한 설정 등 여섯 가지 기능을 소개합니다.</desc>
