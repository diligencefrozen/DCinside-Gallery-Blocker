name: Quick finalize repository

on:
  push:
    paths:
      - ".github/quick-finalize.trigger"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Finalize repository
        run: bash scripts/quick-finalize.sh
