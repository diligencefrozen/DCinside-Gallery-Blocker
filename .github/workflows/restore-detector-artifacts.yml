name: Restore detector artifacts

on:
  push:
    paths:
      - ".github/restore-detector.trigger"

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Restore verified model from the published extension
        shell: bash
        run: |
          set -euo pipefail
          EXTENSION_ID="fnfmdbldnhadkadklplhcjcojjiaopgg"
          CRX_URL="https://clients2.google.com/service/update2/crx?response=redirect&prodversion=140.0.0.0&acceptformat=crx2%2Ccrx3&x=id%3D${EXTENSION_ID}%26uc"
          curl --fail --location --retry 3 --retry-delay 2 "$CRX_URL" -o /tmp/dcb.crx
          python - <<'PY'
          from pathlib import Path
          import hashlib, io, shutil, struct, zipfile

          raw = Path('/tmp/dcb.crx').read_bytes()
          if raw[:4] == b'PK\x03\x04':
              payload = raw
          else:
              if raw[:4] != b'Cr24' or len(raw) < 12:
                  raise SystemExit('Downloaded file is not a CRX/ZIP package.')
              version = struct.unpack('<I', raw[4:8])[0]
              if version == 2:
                  if len(raw) < 16:
                      raise SystemExit('Invalid CRX2 header.')
                  pub_len, sig_len = struct.unpack('<II', raw[8:16])
                  offset = 16 + pub_len + sig_len
              elif version == 3:
                  header_len = struct.unpack('<I', raw[8:12])[0]
                  offset = 12 + header_len
              else:
                  raise SystemExit(f'Unsupported CRX version: {version}')
              payload = raw[offset:]

          out = Path('/tmp/dcb-unpacked')
          out.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(io.BytesIO(payload)) as zf:
              zf.extractall(out)

          model = out / 'models' / 'conflict' / 'model.onnx'
          if not model.is_file():
              raise SystemExit('Published extension does not contain models/conflict/model.onnx.')
          data = model.read_bytes()
          expected_size = 2_404_471
          expected_sha = 'aaf25775067db31d8378b8ec7e0290757f64c509b45636a82db716d6400f1c26'
          actual_sha = hashlib.sha256(data).hexdigest()
          if len(data) != expected_size or actual_sha != expected_sha:
              raise SystemExit(f'Model verification failed: size={len(data)}, sha256={actual_sha}')

          target = Path('models/conflict/model.onnx')
          target.parent.mkdir(parents=True, exist_ok=True)
          shutil.copy2(model, target)
          print(f'Restored verified model: {len(data)} bytes, sha256={actual_sha}')
          PY

      - name: Rebuild pinned browser inference runtime
        shell: bash
        run: |
          set -euo pipefail
          npm install --global pnpm@9.15.9
          pnpm install --frozen-lockfile
          npm run build:detector
          test -f vendor/detector/inference-worker.js
          test -f vendor/detector/ort-wasm-simd-threaded.mjs
          test -f vendor/detector/ort-wasm-simd-threaded.wasm
          test -f vendor/detector/ONNX-Runtime-LICENSE

      - name: Commit restored runtime artifacts
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/restore-detector.trigger
          rm -f .github/workflows/restore-detector-artifacts.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f models/conflict/model.onnx vendor/detector
          git add -A .github
          git commit -m "fix: restore detector model and runtime artifacts"
          git push origin HEAD:main
